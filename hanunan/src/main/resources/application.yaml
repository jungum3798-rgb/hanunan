spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: hanunan

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile_nickname, account_email   # 카카오 제공 scope
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post  # 카카오 필수 설정
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id   # 카카오는 id가 식별자

jwt:
  secret: ${JWT_SECRET} #32글자 이상 Base64 인코딩된 문자열
  expiration: 3000         # 분 단위

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}   # 프론트 리다이렉트 URI (Next.js)

groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

naver:
  news:
    client-id: ${NAVER_NEWS_CLIENT_ID}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET}
    url: https://openapi.naver.com/v1/search/news.json

youtube:
  api:
    key: ${YOUTUBE_API_KEY}

kakao:
  api:
    key: ${KAKAO_API_KEY}

disaster:
  api:
    key: ${DISASTER_API_KEY}
    url: ${DISASTER_API_URL:https://www.safetydata.go.kr/V2/api/DSSP-IF-00247}

safety:
  aed:
    key: ${AED_API_KEY}
    url: ${AED_API_URL:http://www.safetydata.go.kr/V2/api/DSSP-IF-00068}
  shelter:
    key: ${SHELTER_API_KEY}
    url: ${SHELTER_API_URL:https://www.safetydata.go.kr/V2/api/DSSP-IF-10941}


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${SERVER_PORT}

app:
  upload:
    report-image-dir: ${REPORT_IMAGE_DIR:uploads/reports}
