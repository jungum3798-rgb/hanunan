<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>댓글 채팅 테스트</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #333; }
        .section { margin-bottom: 20px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 8px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px;
        }
        button {
            padding: 8px 16px; background: #4CAF50; color: white;
            border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;
        }
        button.danger { background: #f44336; }
        button.secondary { background: #2196F3; }
        #log {
            border: 1px solid #ddd; border-radius: 4px; padding: 12px;
            height: 300px; overflow-y: auto; background: #f9f9f9;
            font-size: 13px; white-space: pre-wrap;
        }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 13px; display: inline-block; }
        .connected { background: #c8e6c9; color: #2e7d32; }
        .disconnected { background: #ffcdd2; color: #c62828; }
    </style>
</head>
<body>

<h2>💬 댓글 채팅 WebSocket 테스트</h2>

<!-- 연결 설정 -->
<div class="section">
    <label>JWT 토큰</label>
    <input id="token" type="text" placeholder="Postman에서 로그인 후 받은 토큰 붙여넣기" />

    <label>지도 타입</label>
    <select id="type">
        <option value="DISASTER">실시간 재난 지도 (DISASTER)</option>
        <option value="SAFETY">안전시설 지도 (SAFETY)</option>
        <option value="REPORT">시민 제보 지도 (REPORT)</option>
    </select>

    <button onclick="connect()">연결</button>
    <button class="danger" onclick="disconnect()">연결 해제</button>
    <span id="status" class="status disconnected">미연결</span>
</div>

<!-- 댓글 작성 -->
<div class="section">
    <label>댓글 내용</label>
    <input id="content" type="text" placeholder="댓글 입력 후 Enter 또는 전송 버튼" onkeydown="if(event.key==='Enter') sendComment()" />
    <button class="secondary" onclick="sendComment()">전송</button>
</div>

<!-- 댓글 삭제 -->
<div class="section">
    <label>댓글 ID로 삭제</label>
    <input id="deleteId" type="number" placeholder="삭제할 댓글 ID" />
    <button class="danger" onclick="deleteComment()">삭제</button>
</div>

<!-- 수신 로그 -->
<div class="section">
    <label>수신 로그 <button class="secondary" style="padding:2px 8px;font-size:12px" onclick="clearLog()">지우기</button></label>
    <div id="log"></div>
</div>

<script>
    let ws = null;

    function stomp(command, headers, body) {
        let frame = command + '\n';
        for (const [k, v] of Object.entries(headers)) frame += k + ':' + v + '\n';
        frame += '\n' + (body || '') + '\x00';
        return frame;
    }

    function log(msg) {
        const el = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        el.textContent += `[${time}] ${msg}\n`;
        el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
        document.getElementById('log').textContent = '';
    }

    function setStatus(connected) {
        const el = document.getElementById('status');
        el.textContent = connected ? '연결됨' : '미연결';
        el.className = 'status ' + (connected ? 'connected' : 'disconnected');
    }

    function connect() {
        const token = document.getElementById('token').value.trim();
        const type = document.getElementById('type').value;

        if (!token) { alert('JWT 토큰을 입력하세요.'); return; }

        ws = new WebSocket('ws://localhost:8081/ws');

        ws.onopen = () => {
            log('✅ WebSocket 연결됨');
            ws.send(stomp('CONNECT', {
                Authorization: 'Bearer ' + token,
                'accept-version': '1.2',
                'heart-beat': '0,0'
            }));
        };

        ws.onmessage = (e) => {
            const data = e.data;
            if (data.includes('CONNECTED')) {
                log('🔗 STOMP 연결 완료');
                setStatus(true);
                // 채팅방 구독
                ws.send(stomp('SUBSCRIBE', { id: 'sub-0', destination: '/topic/comments/' + type }));
                log('📌 구독 완료: /topic/comments/' + type);
                // 기존 댓글 목록 불러오기
                fetchComments(type);
            } else if (data.includes('MESSAGE')) {
                const body = data.split('\n\n')[1]?.replace('\x00', '');
                try {
                    const json = JSON.parse(body);
                    if (json.action === 'CREATE') {
                        log(`💬 새 댓글 [ID:${json.id}] ${json.userName}: ${json.content}`);
                    } else if (json.action === 'DELETE') {
                        log(`🗑️ 댓글 삭제 [ID:${json.id}]`);
                    }
                } catch { log('📩 수신: ' + body); }
            } else if (data.includes('ERROR')) {
                log('❌ 에러: ' + data);
            }
        };

        ws.onclose = () => { log('🔌 연결 종료'); setStatus(false); };
        ws.onerror = () => { log('❌ 연결 오류'); setStatus(false); };
    }

    function disconnect() {
        if (ws) { ws.close(); ws = null; }
    }

    function sendComment() {
        if (!ws) { alert('먼저 연결하세요.'); return; }
        const type = document.getElementById('type').value;
        const content = document.getElementById('content').value.trim();
        if (!content) { alert('댓글 내용을 입력하세요.'); return; }

        const body = JSON.stringify({ type, content });
        ws.send(stomp('SEND', {
            destination: '/app/comments.create',
            'content-type': 'application/json',
            'content-length': new TextEncoder().encode(body).length
        }, body));

        document.getElementById('content').value = '';
    }

    function deleteComment() {
        if (!ws) { alert('먼저 연결하세요.'); return; }
        const commentId = document.getElementById('deleteId').value;
        if (!commentId) { alert('삭제할 댓글 ID를 입력하세요.'); return; }

        const body = JSON.stringify({ commentId: Number(commentId) });
        ws.send(stomp('SEND', {
            destination: '/app/comments.delete',
            'content-type': 'application/json',
            'content-length': new TextEncoder().encode(body).length
        }, body));
    }

    function fetchComments(type) {
        fetch(`/api/comments?type=${type}`)
            .then(r => r.json())
            .then(data => {
                log(`📋 기존 댓글 ${data.length}개 로드`);
                data.forEach(c => log(`  [ID:${c.id}] ${c.userName}: ${c.content}`));
            });
    }
</script>

</body>
</html>
